# Perfil usado só pelo SubidaDaAplicacaoTest, que sobe a aplicação inteira.
#
# Banco PRÓPRIO, separado do de desenvolvimento: o teste deixa rastro (linhas de auditoria do
# login recusado, conta inicial), e isso não pode cair nos dados de trabalho de ninguém.
#
# Criar uma vez, como superusuário — o usuário 'gestao' não tem permissão para criar bancos:
#     psql -U postgres -c "CREATE DATABASE gestao_operadores_teste OWNER gestao"
#
# O schema é criado pelo Flyway na primeira execução do teste. Se o banco não existir, o teste
# falha com "FATAL: database gestao_operadores_teste does not exist" — de propósito: uma rede de
# segurança que se desliga sozinha quando o ambiente não está pronto não protege nada.
DB_URL=jdbc:postgresql://localhost:5432/gestao_operadores_teste
DB_USER=gestao
DB_PASSWORD=gestao_dev

# Valor fixo e sem valor nenhum fora daqui: o teste precisa de um segredo que passe pelo mínimo
# de 32 caracteres, não de um segredo de verdade.
JWT_SECRET=segredo-de-teste-sem-uso-real-com-mais-de-32-caracteres

# Conta usada pelo teste para fazer login de verdade e exercitar os endpoints autenticados
# (exportação em CSV, por exemplo). Existe só neste banco descartável; a senha não vale em
# lugar nenhum, mas precisa passar pela política de senha do sistema como qualquer outra.
#
# ATENÇÃO ao mexer aqui: a senha não pode conter trecho do e-mail. A primeira versão deste
# arquivo usava "Teste!..." com o e-mail "teste@...", a política recusou, a conta não foi
# criada e os testes falharam com um 401 difícil de ligar à causa. Se mudar o e-mail, confira
# que a senha não ecoa nenhum pedaço dele.
ADMIN_EMAIL=teste@exemplo.invalid
ADMIN_PASSWORD=Palmeira!Sereno#42xK

# Vazio = nenhuma origem externa liberada, como na instalação da empresa.
CORS_ORIGENS=
