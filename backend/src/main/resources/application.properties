spring.application.name=gestao-competencias

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_operadores}
spring.datasource.username=${DB_USER:gestao}
spring.datasource.password=${DB_PASSWORD:gestao_dev}

# O schema é responsabilidade do Flyway; o Hibernate apenas confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Nada de detalhe técnico na resposta de erro: mensagem de exceção, pilha e nome de classe ficam
# só no log do servidor. Quem escreve o corpo de erro visível é o ErrosHandler.
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Limites do upload de importação (CSV).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Tetos de tamanho: formulário (x-www-form-urlencoded) e cabeçalhos. O corpo JSON não é limitado
# por estas propriedades — ver a lista de pendências do SEGURANCA.md.
server.tomcat.max-http-form-post-size=256KB
server.max-http-request-header-size=16KB

# Conta de supervisor: criada no boot se o e-mail ainda não existir (idempotente).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Socorro para senha esquecida. Com true, o boot REDEFINE a senha de app.admin.email se a conta
# já existir, em vez de ignorá-la. Existe porque não há recuperação de senha por e-mail: sem
# isto, supervisor que esquece a senha só volta com UPDATE manual no banco.
#
# Precisa ser removido depois de usar: enquanto ficar true, cada reinício devolve a senha ao
# valor do arquivo — desfazendo em silêncio a troca que o supervisor fez. A aplicação avisa em
# WARN a cada boot enquanto estiver ligado.
app.admin.reset=${RESET_SENHA:false}

# Token de sessão (JWT assinado com HMAC). O segredo precisa de 32+ caracteres.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXP_MIN:480}

# Origens do front liberadas no CORS (separadas por vírgula). Em produção, o domínio
# publicado do front; '*' não é aceito. O padrão serve ao Vite local.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Saúde da aplicação, para o monitoramento da TI: GET /actuator/health devolve {"status":"UP"}
# e passa a DOWN se o banco cair. Só este endpoint é exposto, e sem detalhe algum — a lista de
# componentes diria qual banco, qual versão e quais integrações existem, que é mapa para quem
# está sondando. As sondas de readiness/liveness servem a quem orquestra container.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Desligamento gracioso: ao receber o sinal de parada, termina as requisições em andamento
# antes de sair, em vez de cortar a resposta de quem estava salvando uma avaliação.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# true quando a aplicação roda atrás de um proxy que termina o TLS (Render, Railway, nginx).
# Liga a leitura de X-Forwarded-For/Proto: sem isso, o IP registrado é o do proxy (igual para
# todos) e a aplicação não sabe que a requisição chegou por https. Em acesso direto precisa ficar
# false, porque o cabeçalho é enviado pelo cliente e qualquer um pode forjá-lo.
app.proxy.confiavel=${ATRAS_DE_PROXY:false}
