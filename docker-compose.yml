# Opcional: alternativa a instalar o PostgreSQL no Windows.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gestao_operadores
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
volumes:
  dados_pg:
