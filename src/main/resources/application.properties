spring.application.name=gestao-competencias

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_operadores}
spring.datasource.username=${DB_USER:gestao}
spring.datasource.password=${DB_PASSWORD:gestao_dev}

# O schema é responsabilidade do Flyway; o Hibernate apenas confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.error.include-message=always

# Limites do upload de importação (CSV).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Primeiro supervisor (criado somente se a tabela estiver vazia)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Token de sessão (JWT assinado com HMAC). O segredo precisa de 32+ caracteres.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXP_MIN:480}

# Origens do front liberadas no CORS (separadas por vírgula). Em produção, o domínio
# publicado do front; '*' não é aceito. O padrão serve ao Vite local.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
